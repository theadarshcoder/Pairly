<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pairly — Turn passive lectures into live, interactive experiences." />
    <meta name="theme-color" content="#0A0A0C" />
    <!-- Issue 13: PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Issue 6: Load fonts in index.html ONLY. Do not @import in CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/UntitledSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/UntitledSerif-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'UntitledSerif';
        src: url('/fonts/UntitledSerif-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'UntitledSerif';
        src: url('/fonts/UntitledSerif-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <title>Pairly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
